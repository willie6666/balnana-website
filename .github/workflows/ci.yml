name: Website checks and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: python3 tool/check_locales.py
      - run: python3 -m unittest test_web_metadata.py
      - run: flutter analyze
      - run: flutter test
      - name: Build static website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash tool/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: balnana-website
          path: build/web
          if-no-files-found: error
          retention-days: 14
