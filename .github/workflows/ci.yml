name: Website checks, build and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Require the production origin
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [[ -z "$SITE_URL" ]]; then
            echo '::error::Set the repository variable SITE_URL to the production origin before deploying.'
            exit 1
          fi
      - name: Install the pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: flutter pub get
      - run: python3 tool/check_locales.py
      - run: python3 -m unittest test_web_metadata.py
      - run: flutter analyze
      - run: flutter test
      - name: Build static website
        env:
          # PRs and other branches must keep their preview / noindex metadata.
          SITE_URL: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SITE_URL || '' }}
        run: bash tool/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: balnana-website
          path: build/web
          if-no-files-found: error
          retention-days: 14
  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          for setting in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing GitHub Actions setting: $setting. See dev-docs/DEPLOYMENT.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the verified website
        uses: actions/download-artifact@v8
        with:
          name: balnana-website
          path: build/web
      - name: Deploy the verified website
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          printf 'Deployed website: %s\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
