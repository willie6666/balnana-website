<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1810" viewBox="0 0 430 1810"><title>Balnana website concept — mobile</title><desc>Static website concept. The interface card is illustrative; embedded App screenshots contain fictional demo data.</desc><style>text{font-family:"Plus Jakarta Sans","Noto Sans CJK TC",sans-serif} .number{font-variant-numeric:tabular-nums}</style><rect x="0" y="0" width="430" height="1810" rx="0" fill="#FCF9F4" /><text x="24" y="25" font-size="9" font-weight="700" fill="#66655C" letter-spacing="1.5">BALNANA / MOBILE CONCEPT</text><g transform="translate(24 53) scale(0.5)"><circle cx="36" cy="36" r="36" fill="#E8A800"/><path transform="translate(-18 -18)" fill="#3A2C00" d="M51.5,33.131A24,24 0,0 0 51.5,80.869ZM56.5,27.131A24,24 0,0 1 56.5,74.869Z"/></g><text x="71" y="82" font-size="25" font-weight="800" fill="#24251E" >balnana</text><rect x="279" y="52" width="60" height="38" rx="19.0" fill="#EAE6DC" /><text x="309.0" y="77.0" font-size="12" font-weight="700" fill="#24251E" text-anchor="middle">語言</text><rect x="347" y="52" width="38" height="38" rx="19.0" fill="#EAE6DC" /><text x="366.0" y="77.0" font-size="18" font-weight="700" fill="#24251E" text-anchor="middle">◐</text><text x="396" y="79" font-size="25" font-weight="400" fill="#24251E" text-anchor="middle">≡</text><rect x="24" y="137" width="259" height="31" rx="16" fill="#F8E3AD" /><text x="39" y="158" font-size="10" font-weight="800" fill="#4D3900" letter-spacing="1">OPEN SOURCE · SELF-HOSTED</text><text x="20" y="247" font-size="64" font-weight="800" fill="#24251E" >一起玩，</text><text x="20" y="326" font-size="64" font-weight="800" fill="#24251E" >輕鬆算清。</text><text x="26" y="373" font-size="16" font-weight="400" fill="#66655C" >旅行、聚餐、合租，共同開銷一目了然。</text><text x="26" y="404" font-size="16" font-weight="400" fill="#66655C" >分帳更輕鬆，資料也由你掌握。</text><rect x="24" y="439" width="181" height="53" rx="26.5" fill="#E8A800" /><text x="114.5" y="471.5" font-size="16" font-weight="700" fill="#352900" text-anchor="middle">體驗分帳 ↗</text><rect x="217" y="439" width="167" height="53" rx="26.5" fill="#EAE6DC" /><text x="300.5" y="471.5" font-size="16" font-weight="700" fill="#24251E" text-anchor="middle">自行架設</text><text x="26" y="523" font-size="12" font-weight="400" fill="#66655C" >開發中 · Android 與 Web · 20 個語系</text><path d="M298 569 C450 619 391 966 191 944" fill="none" stroke="#F2D477" stroke-width="40" stroke-linecap="round"/><text x="26" y="573" font-size="12" font-weight="400" fill="#66655C" >示範資料 · 京都週末</text><g transform="translate(24 592) scale(0.824)"><rect x="0" y="0" width="464" height="466" rx="32" fill="#F3EFE6" /><text x="28" y="43" font-size="25" font-weight="700" fill="#24251E" >京都週末</text><text x="434" y="41" font-size="14" font-weight="400" fill="#66655C" text-anchor="end">4 人</text><rect x="24" y="66" width="416" height="112" rx="24" fill="#F8E3AD" /><text x="46" y="101" font-size="16" font-weight="600" fill="#4D3900" >你將收到</text><text x="46" y="151" font-size="45" font-weight="800" fill="#4D3900" >¥35,113</text><text x="28" y="213" font-size="15" font-weight="600" fill="#66655C" >大家的餘額</text><circle cx="56" cy="246" r="19" fill="#8A5A3C"/><text x="56" y="252" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text><text x="56" y="283" font-size="13" font-weight="400" fill="#66655C" text-anchor="middle">Alex</text><text x="56" y="309" font-size="15" font-weight="700" fill="#1E7A46" text-anchor="middle">+35,113</text><circle cx="171" cy="246" r="19" fill="#8E5BC8"/><text x="171" y="252" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">J</text><text x="171" y="283" font-size="13" font-weight="400" fill="#66655C" text-anchor="middle">Jamie</text><text x="171" y="309" font-size="15" font-weight="700" fill="#B42318" text-anchor="middle">−10,287</text><circle cx="286" cy="246" r="19" fill="#3E8EDE"/><text x="286" y="252" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text><text x="286" y="283" font-size="13" font-weight="400" fill="#66655C" text-anchor="middle">Morgan</text><text x="286" y="309" font-size="15" font-weight="700" fill="#B42318" text-anchor="middle">−20,888</text><circle cx="401" cy="246" r="19" fill="#F07C2E"/><text x="401" y="252" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">S</text><text x="401" y="283" font-size="13" font-weight="400" fill="#66655C" text-anchor="middle">Sam</text><text x="401" y="309" font-size="15" font-weight="700" fill="#B42318" text-anchor="middle">−3,938</text><rect x="24" y="334" width="416" height="106" rx="23" fill="#EAE6DC" /><text x="46" y="367" font-size="15" font-weight="700" fill="#24251E" >結算建議</text><circle cx="66" cy="402" r="17" fill="#3E8EDE"/><text x="66" y="408" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text><text x="94" y="408" font-size="21" font-weight="400" fill="#66655C" >→</text><circle cx="140" cy="402" r="17" fill="#8A5A3C"/><text x="140" y="408" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text><text x="172" y="408" font-size="21" font-weight="700" fill="#24251E" >¥20,888</text><text x="418" y="408" font-size="14" font-weight="400" fill="#66655C" text-anchor="end">+ 2 筆</text></g><text x="25" y="1041" font-size="32" font-weight="800" fill="#24251E" >一起分帳，很簡單。</text><text x="26" y="1077" font-size="15" font-weight="400" fill="#66655C" >從第一筆支出，到最後一筆結算。</text><rect x="24" y="1105" width="382" height="170" rx="28" fill="#F8E3AD" /><text x="47" y="1147" font-size="24" font-weight="700" fill="#4D3900" >分法，由你決定。</text><text x="48" y="1180" font-size="15" font-weight="400" fill="#4D3900" >等分、指定金額，或依份數分攤。</text><rect x="47" y="1206" width="94" height="40" rx="20.0" fill="#E8A800" /><text x="94.0" y="1232.0" font-size="14" font-weight="700" fill="#352900" text-anchor="middle">旅行</text><rect x="151" y="1206" width="94" height="40" rx="20.0" fill="#EAE6DC" /><text x="198.0" y="1232.0" font-size="14" font-weight="700" fill="#24251E" text-anchor="middle">合租</text><rect x="255" y="1206" width="94" height="40" rx="20.0" fill="#EAE6DC" /><text x="302.0" y="1232.0" font-size="14" font-weight="700" fill="#24251E" text-anchor="middle">聚餐</text><rect x="24" y="1293" width="382" height="139" rx="28" fill="#F3EFE6" /><text x="47" y="1336" font-size="24" font-weight="700" fill="#24251E" >結算，少一點麻煩。</text><text x="48" y="1370" font-size="15" font-weight="400" fill="#66655C" >各人餘額與建議付款，一眼就懂。</text><text x="48" y="1406" font-size="13" font-weight="600" fill="#765800" >此示範：4 人 → 3 筆建議付款</text><rect x="24" y="1450" width="382" height="139" rx="28" fill="#F3EFE6" /><text x="47" y="1493" font-size="23" font-weight="700" fill="#24251E" >你的群組，你的伺服器。</text><text x="48" y="1527" font-size="15" font-weight="400" fill="#66655C" >開源、自行架設，掌握自己的帳目。</text><text x="48" y="1563" font-size="13" font-weight="700" fill="#765800" >認識自行架設  ↗</text><rect x="24" y="1618" width="382" height="130" rx="28" fill="#EAE6DC" /><text x="48" y="1662" font-size="25" font-weight="800" fill="#24251E" >下一站，一起出發。</text><text x="48" y="1707" font-size="17" font-weight="400" fill="#66655C" >Good times. Clear balances.</text><text x="24" y="1782" font-size="11" font-weight="400" fill="#66655C" >靜態概念稿 · 示範卡為官網示意介面</text></svg>